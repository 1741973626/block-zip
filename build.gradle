plugins {
	// 1.21.1 时代用经典插件 id `fabric-loom`（`net.fabricmc.fabric-loom` 是后期才引入的标记 id）
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"block_zip" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 1.21.1 仍然混淆，用 Mojang 官方映射（类名/字段名与 26.3 版一致，移植成本最低）
	mappings loom.officialMojangMappings()
	// 1.21.1 时代用 modImplementation（Loom 会做 remap，且 Mixin 由 loader 传递进来）
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

// 无界面自检：gradlew variantReport，打印变种集合分组结果（不需要开游戏）
tasks.register('variantReport', JavaExec) {
	dependsOn 'clientClasses'
	classpath = sourceSets.client.runtimeClasspath
	mainClass = 'com.blockzip.client.debug.VariantReport'
}
